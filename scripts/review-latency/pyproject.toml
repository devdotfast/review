[project]
name = "review-latency"
version = "0.1.0"
description = "Measure user-prompt-to-published-document latency for dev-review authoring runs."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
review-latency = "review_latency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_latency"]
