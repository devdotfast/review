name: Review Desktop Update Smoke

# Proves a published build updates in place on macOS: each job runs one
# starting build from a throwaway folder, lets Squirrel install the channel's
# current release, and checks the bundle kept its folder name. One job per
# update zip, so both a pre-rename (Review) and a renamed (Whiteboard) install
# are covered. Runners are separate machines, so their Squirrel state is too.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Channel whose current release the build should update to"
        type: choice
        options:
          - preview
          - stable
        default: preview
      from_version:
        description: "Published version to start from, e.g. 0.0.34-preview.20260924.59 (must be older than the channel's current release)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: ${{ matrix.artifact }} zip → current ${{ inputs.quality }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        artifact: [Review, Whiteboard]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: apps/review-desktop/scripts
      - name: Update in place
        run: |
          chmod +x apps/review-desktop/scripts/update-smoke.sh
          apps/review-desktop/scripts/update-smoke.sh "${{ inputs.quality }}" "${{ inputs.from_version }}" "${{ matrix.artifact }}"
      - name: Keep the app and installer logs
        if: always()
        run: |
          mkdir -p logs
          cp "$RUNNER_TEMP"/update-smoke-*/app.stderr logs/ 2>/dev/null || true
          cp "$HOME"/Library/Caches/dev.fast.review*.ShipIt/ShipIt_stderr.log logs/ 2>/dev/null || true
          find "$RUNNER_TEMP"/update-smoke-*/state/user-data/logs -name main.log -exec cp {} logs/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: update-smoke-${{ inputs.quality }}-${{ matrix.artifact }}
          path: logs
          if-no-files-found: ignore
          retention-days: 3
