name: Review Windows package CI

on:
  pull_request:
    paths:
      - ".github/workflows/review-windows-*.yml"
      - ".github/workflows/review-desktop-release.yml"
      - ".github/workflows/review-desktop-preview.yml"
      - "apps/review-desktop/**"
      - "packages/review/**"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign with Azure Artifact Signing (uses the shared monthly signature quota)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    # Fork pull requests would otherwise run on the paid 16-core runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: "0.1.2"
          - channel: preview
            version: "0.1.3-preview.1"
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/review-windows-build.yml
    with:
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      version: ${{ matrix.version }}
      artifact_name: windows-packages-${{ matrix.channel }}
      sign: ${{ inputs.sign == true }}
      upgrade_fixture: true

  installed:
    name: Installation, coexistence and removal
    needs: packages
    runs-on: review_big_boy_windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-packages-*
          path: artifacts/installers
      - name: Test installation, coexistence and removal
        # A step timeout fails the step and keeps its log; the job timeout would discard it.
        timeout-minutes: 20
        run: node apps/review-desktop/scripts/verify-installed-windows.mjs artifacts/installers
      - name: Upload installed desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installed-evidence
          path: artifacts/windows-installed/*
