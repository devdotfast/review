# Authoring-latency runs. `uv run review-latency run --id review-27` runs one;
# `--all` runs every entry. Paths are absolute so the harness can be invoked
# from anywhere.

[defaults]
model = "opus"
# Pinned explicitly: `claude -p` otherwise inherits ~/.claude/settings.json effortLevel.
effort = "high"
runs_dir = "~/.dev/review-latency/runs"
# "source": run packages/progressive-review/src/cli.ts (instrumented, no
# desktop delegation) as `review` on the agent's PATH. "installed": use
# whatever `review` already resolves to.
review_cli = "source"
# Which Review Desktop each run launches: "packaged" (/Applications, what users
# run) or "dev" (this checkout's Code OSS build, needed to measure desktop-side
# instrumentation). Per-run override: desktop = "dev".
# Default is "dev": server- and desktop-side fixes made in this checkout must be
# exercised by the desktop the runs talk to. review#8 A/B showed no time-to-visible
# difference between the two (229s packaged vs 224s dev).
desktop = "dev"
max_turns = 300
timeout_minutes = 60
# The harness measures prompt -> published document and terminates the agent
# once the document is published and shown (or when it enters `review wait`),
# so the prompt carries no harness instructions.
# Slash-command syntax: args follow after a space (a colon makes the harness
# reject the command name).
prompt = "/dev-review write me a review of PR #{pr}"
# Fork runs replay the session at its cut state, so the review target is the
# branch the worktree is on — not the PR head, which usually moved on after
# the cut and would make the agent explore commits it never saw.
prompt_fork = "/dev-review write me a review of this branch"

[repos.review]
path = "/Volumes/workspace/src/review"

[repos.dev]
path = "/Users/sidharthkmenon/workspace/src/dev"

