packages:
  - "packages/*"
  - "apps/*"

nodeLinker: hoisted
enableGlobalVirtualStore: true
strictPeerDependencies: false
autoInstallPeers: false
verifyDepsBeforeRun: false
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@hono/node-server@2.0.12"
  - "@typescript/typescript-*"
  - typescript@7.0.1-rc
  - typescript-7@7.0.1-rc
  # Checked before pinning: no GitHub security advisory, no open or closed
  # issue reporting a vulnerability, and `npm audit` reports none.
  - fuzzysort@4.0.2

overrides:
  "@babel/core": "7.29.7"
  # progressive-review declares a registry range; this override is what makes
  # it resolve to the workspace package. Do not remove it.
  "@dev.fast/local-vcs": "workspace:0.1.0"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "brace-expansion@2": "2.1.2"
  "brace-expansion@5": "5.0.8"
  esbuild: "0.28.1"
  hono: "4.12.34"
  ip-address: "10.2.0"
  js-yaml: "4.3.0"
  fast-uri: "3.1.4"
  postcss: "8.5.23"
  shell-quote: "1.9.0"
  tar: "7.5.22"
  qs: "6.15.2"
  undici: "7.29.0"
  vite: "8.0.16"

allowBuilds:
  '@ast-grep/cli': set this to true or false
  esbuild: true

# Native binary swapped in by the package's postinstall.
onlyBuiltDependencies:
  - "@ast-grep/cli"
