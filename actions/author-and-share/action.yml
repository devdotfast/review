name: Author and share a Review
description: Run your agent against a prepared checkout, publish its batch Review, and update a PR comment.
inputs:
  review-version:
    description: Exact @dev.fast/review package version containing headless sharing.
    required: true
  author-command:
    description: Bash command invoking your installed agent. Read REVIEW_PROMPT_FILE and commit exactly one review.
    required: true
  prompt:
    description: Additional instructions appended to the batch authoring prompt.
    default: Explain the change concisely with verified source evidence.
  repository-path:
    description: Prepared checkout with the reviewed commits and a GitHub origin.
    default: .
  base:
    description: Explicit base revision (defaults to the pull request base SHA).
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Explicit head revision (defaults to the pull request head SHA).
    default: ${{ github.event.pull_request.head.sha }}
  share-token:
    description: Review sharing bearer token, supplied from a repository or environment secret.
    required: true
  share-origin:
    description: Optional HTTPS origin for a non-default sharing service.
    default: ""
  comment:
    description: Create or update one link comment on the triggering pull request.
    default: "true"
  github-token:
    description: GITHUB_TOKEN with pull-requests write permission when commenting.
    default: ${{ github.token }}
outputs:
  url:
    description: Share link for the committed review.
    value: ${{ steps.author.outputs.url }}
  review-id:
    description: Local committed review identity.
    value: ${{ steps.author.outputs.review-id }}
  version:
    description: Exact committed version uploaded.
    value: ${{ steps.author.outputs.version }}
  share-id:
    description: Published share identity, usable with review share revoke.
    value: ${{ steps.author.outputs.share-id }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
    - name: Install Review runtime
      shell: bash
      env:
        REVIEW_VERSION: ${{ inputs.review-version }}
      run: |
        if [[ ! "$REVIEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo 'review-version must be an exact package version.' >&2
          exit 1
        fi
        npm install --global "@dev.fast/review@$REVIEW_VERSION"
    - name: Author, upload and link
      id: author
      shell: bash
      env:
        REVIEW_ACTION_PATH: ${{ github.action_path }}
        REVIEW_AUTHOR_COMMAND: ${{ inputs.author-command }}
        REVIEW_PROMPT: ${{ inputs.prompt }}
        REVIEW_REPOSITORY_PATH: ${{ inputs.repository-path }}
        REVIEW_BASE: ${{ inputs.base }}
        REVIEW_HEAD: ${{ inputs.head }}
        DEV_REVIEW_SHARE_TOKEN: ${{ inputs.share-token }}
        REVIEW_SHARE_ORIGIN: ${{ inputs.share-origin }}
        REVIEW_COMMENT: ${{ inputs.comment }}
        REVIEW_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$REVIEW_ACTION_PATH/run.mjs"
