name: Review Desktop Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_source:
        description: "Release main's tip, or promote a published preview tag."
        required: true
        type: choice
        options:
          - main
          - preview
        default: main
      preview_tag:
        description: "Preview tag to promote, e.g. v0.0.32-preview.20260907.7. Required when release_source is preview."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build and validate only. Do not tag, upload, or publish."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: review-desktop-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    # The environment requires repository-admin approval before GitHub assigns
    # this job to the release-only runner group.
    environment: review-release
    runs-on: review_big_boy
    outputs:
      version: ${{ steps.bump.outputs.version || steps.dryrun.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit: ${{ steps.bump.outputs.commit || steps.dryrun.outputs.commit }}
    steps:
      # The `main` ruleset requires a pull request and the "Review Desktop"
      # check, and lists DeployKey as its only non-admin bypass actor. Checking
      # out over SSH with the release deploy key is therefore the one way this
      # job can land the version bump on main directly.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Every read-only gate lives here so a dry run rehearses the same checks a
      # real run must pass, and so the write step below re-derives nothing.
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_SOURCE: ${{ inputs.release_source }}
          PREVIEW_TAG_INPUT: ${{ inputs.preview_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A dispatch form field left with stale text arrives as a non-empty
          # string, so trim before testing for emptiness.
          PREVIEW_TAG="$(printf '%s' "$PREVIEW_TAG_INPUT" | tr -d '[:space:]')"

          if [ "$RELEASE_SOURCE" != "preview" ] && [ -n "$PREVIEW_TAG" ]; then
            echo "::error::preview_tag only applies when release_source is 'preview'. Clear the field, or set release_source to 'preview'."
            exit 1
          fi

          CURRENT=$(node -p "require('./apps/review-desktop/package.json').version")
          # The pattern must stay an unquoted variable: bash matches a quoted
          # right-hand side as a literal string, not as a regex.
          version_re='^([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ ! $CURRENT =~ $version_re ]]; then
            echo "::error::apps/review-desktop/package.json is at '${CURRENT}', which is not X.Y.Z. ${GITHUB_REF_NAME} must never carry a prerelease version."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump type '${BUMP}'"; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if [ "$RELEASE_SOURCE" = "preview" ]; then
            if [ -z "$PREVIEW_TAG" ]; then
              echo "::error::release_source 'preview' requires preview_tag, e.g. v${VERSION}-preview.$(date -u +%Y%m%d).1 — take it from the preview run that published the build you are promoting."
              exit 1
            fi
            if [ "$BUMP" != "patch" ]; then
              echo "::error::a preview always targets the next patch, so promoting one requires bump 'patch' (got '${BUMP}'). Release from ${GITHUB_REF_NAME} for a minor or major."
              exit 1
            fi

            preview_re='^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.[0-9]{8}\.[0-9]+$'
            if [[ ! $PREVIEW_TAG =~ $preview_re ]]; then
              echo "::error::preview_tag '${PREVIEW_TAG}' is not a preview tag. Expected vX.Y.Z-preview.YYYYMMDD.N, as pushed by review-desktop-preview.yml."
              exit 1
            fi
            PREVIEW_VERSION="${BASH_REMATCH[1]}"

            if ! git ls-remote --exit-code --tags origin "refs/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then
              echo "::error::${PREVIEW_TAG} does not exist on origin. Only a preview that finished publishing from ${GITHUB_REF_NAME} is tagged."
              exit 1
            fi
            # `+` so a tag already in this checkout cannot block the fetch, and
            # `^{commit}` peels a lightweight and an annotated tag alike.
            git fetch --no-tags origin "+refs/tags/${PREVIEW_TAG}:refs/tags/${PREVIEW_TAG}"
            PREVIEW_COMMIT=$(git rev-parse "refs/tags/${PREVIEW_TAG}^{commit}")

            # Whatever merged since the preview published stays out of this
            # release: promotion ships the commit that was actually tested. It
            # must still be on ${GITHUB_REF_NAME}, so a branch that never landed
            # cannot be released. Asked over the API because this checkout is
            # shallow and has no history to walk.
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${PREVIEW_COMMIT}" --jq .status)
            case "$STATUS" in
              identical | behind) ;;
              *)
                echo "::error::${PREVIEW_TAG} was built from ${PREVIEW_COMMIT}, which is not on ${GITHUB_REF_NAME} (${STATUS}). Only a preview built from a commit that landed can be promoted."
                exit 1
                ;;
            esac
            # Load-bearing: a preview computes its version from the package.json
            # it was built against, so this is what catches a preview that
            # straddled another release and now targets a version already cut.
            if [ "$PREVIEW_VERSION" != "$VERSION" ]; then
              echo "::error::${PREVIEW_TAG} targets ${PREVIEW_VERSION}, but the next patch from ${CURRENT} is ${VERSION}. That preview predates a release; publish a new one."
              exit 1
            fi

            echo "Promoting ${PREVIEW_TAG} (${PREVIEW_COMMIT}) to Review Desktop ${TAG}."
          else
            echo "Releasing Review Desktop ${TAG} from ${GITHUB_REF_NAME}."
          fi

          # Remote write-state, checked only where a push actually follows. Both
          # run before anything is written, so a doomed run stops without
          # leaving a tag or a commit behind.
          if [ "$DRY_RUN" != "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::${TAG} already exists on origin. Delete it before re-running."
              exit 1
            fi

            git fetch origin "${GITHUB_REF_NAME}"
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::${GITHUB_REF_NAME} moved since this run started. Re-run the workflow."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "preview_commit=$PREVIEW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Bump version and create tag
        if: ${{ !inputs.dry_run }}
        id: bump
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREVIEW_COMMIT: ${{ steps.resolve.outputs.preview_commit }}
        run: |
          # product.json carries the same number to the running app, which shows
          # it in the About panel, alongside the stable channel identity.
          # `scripts/product-hardening.test.mjs` fails if these drift apart.
          node apps/review-desktop/scripts/stamp-release-channel.mjs \
            --version "$VERSION" \
            --quality stable

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/review-desktop/package.json apps/review-desktop/code-oss/product.json
          git commit -m "chore(review-desktop): bump version to ${VERSION} [skip ci]"

          # The tag marks what shipped, which for a promotion is the commit the
          # preview was built from rather than this bump. The build jobs stamp
          # the version onto that tree, the way the preview run stamped its own.
          # The bump still lands on ${GITHUB_REF_NAME} because the next release
          # derives its version from there.
          TARGET="${PREVIEW_COMMIT:-$(git rev-parse HEAD)}"
          git tag "$TAG" "$TARGET"
          # Atomic: the previous release left an orphan tag on origin because
          # the branch push was rejected after the tag push had already landed.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Dry-run version
        if: ${{ inputs.dry_run }}
        id: dryrun
        shell: bash
        env:
          RELEASE_SOURCE: ${{ inputs.release_source }}
          RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
          PREVIEW_COMMIT: ${{ steps.resolve.outputs.preview_commit }}
        run: |
          if [ "$RELEASE_SOURCE" = "preview" ]; then
            # The build jobs stamp the promoted version into this same commit,
            # so the artifacts a promotion dry run validates carry it too.
            VERSION="$RESOLVED_VERSION"
          else
            # Nothing stamps a release-from-main dry run, so the artifacts carry
            # the version already committed here.
            VERSION=$(node -p "require('./apps/review-desktop/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${PREVIEW_COMMIT:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Review Desktop ${{ steps.bump.outputs.version }}" \
            --draft \
            --generate-notes

  compile:
    name: Compile Darwin payload on Linux
    needs: tag
    runs-on: review_big_boy
    timeout-minutes: 45
    steps:
      - name: Checkout resolved release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.tag.outputs.commit }}

      # A promotion checks out the commit the preview was built from, whose tree
      # still carries the version released before it. Stamp the promoted version
      # so the packaged artifacts and the feed manifest carry it, the way the
      # preview run stamped its own version onto this same tree.
      - name: Stamp the promoted version
        if: ${{ inputs.release_source == 'preview' }}
        run: |
          node apps/review-desktop/scripts/stamp-release-channel.mjs \
            --version "${{ needs.tag.outputs.version }}" \
            --quality stable

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      # Headers for the Code OSS native modules npm ci builds from source.
      - name: Install Code OSS native build prerequisites
        run: |
          # The hosted runner image lists an HTTP Azure mirror first. That
          # mirror can accept the release file and then hang on package indexes.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: apps/review-desktop/code-oss/**/package-lock.json

      - name: Restore Code OSS dependencies
        id: code-oss-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-code-oss-deps-v2-

      # Linux owns every platform-independent build output and also downloads
      # the pinned darwin-arm64 VSIX payloads. The macOS job packages this
      # archive; it must not silently rebuild or omit anything transferred here.
      - name: Compile Darwin payload on Linux
        env:
          # Embeds the PostHog project key into the review runtime build so
          # released apps ship telemetry enabled. Source builds embed nothing.
          REVIEW_POSTHOG_KEY: ${{ vars.REVIEW_POSTHOG_KEY }}
        run: bash apps/review-desktop/scripts/compile-darwin-payload.sh

      - name: Upload darwin payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-payload
          path: apps/review-desktop/dist/darwin-payload.tar.zst
          retention-days: 3
          compression-level: 0

      - name: Check for existing Code OSS dependency cache
        if: steps.code-oss-deps.outputs.cache-hit != 'true'
        id: code-oss-deps-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}
          lookup-only: true

      - name: Save Code OSS dependencies
        if: steps.code-oss-deps.outputs.cache-hit != 'true' && steps.code-oss-deps-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}

  build:
    name: Build, sign, publish
    needs: [tag, compile]
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout resolved release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.tag.outputs.commit }}

      # A promotion checks out the commit the preview was built from, whose tree
      # still carries the version released before it. Stamp the promoted version
      # so the packaged artifacts and the feed manifest carry it, the way the
      # preview run stamped its own version onto this same tree.
      - name: Stamp the promoted version
        if: ${{ inputs.release_source == 'preview' }}
        run: |
          node apps/review-desktop/scripts/stamp-release-channel.mjs \
            --version "${{ needs.tag.outputs.version }}" \
            --quality stable

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: apps/review-desktop/code-oss/**/package-lock.json

      - name: Restore Code OSS dependencies
        id: code-oss-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-code-oss-deps-v2-

      - name: Download darwin payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin-payload
          path: ${{ runner.temp }}/darwin-payload

      - name: Extract darwin payload
        run: |
          zstd -dc "$RUNNER_TEMP/darwin-payload/darwin-payload.tar.zst" | tar -xf - -C .

      # package-macos.sh checks the complete handoff before Gulp runs, stages
      # every manifest-selected curated extension, and verifies the final app
      # before signing. validate-release-artifacts.mjs repeats that extension
      # check after notarization and before any upload.

      # Carson's keychain bootstrap: decode the Developer ID cert into a
      # throwaway keychain that sign.ts finds via AGENT_TEMPDIRECTORY.
      - name: Import Apple signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/buildagent.keychain"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          # Append rather than replace: `-s "$KEYCHAIN_PATH"` alone evicts
          # login.keychain from the search list for the rest of the job.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # An App Store Connect team key, not an Apple ID password: it survives
      # password and 2FA changes on the Apple ID, and the private key stays a
      # file rather than an environment value.
      - name: Write App Store Connect notary key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Package, sign, and notarize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          CODESIGN_IDENTITY: "Developer ID Application: ${{ vars.APPLE_SIGN_IDENTITY }}"
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          SKIP_NOTARIZE: ${{ vars.SKIP_NOTARIZE }}
          REVIEW_DESKTOP_PRECOMPILED: "1"
        run: |
          # The build can run well over an hour before the first codesign call.
          security unlock-keychain -p "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" \
            "$RUNNER_TEMP/buildagent.keychain"
          pnpm --filter @dev.fast/review-desktop app:package:macos

      - name: Check for existing Code OSS dependency cache
        if: steps.code-oss-deps.outputs.cache-hit != 'true'
        id: code-oss-deps-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}
          lookup-only: true

      - name: Save Code OSS dependencies
        if: steps.code-oss-deps.outputs.cache-hit != 'true' && steps.code-oss-deps-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/review-desktop/code-oss/node_modules
            apps/review-desktop/code-oss/build/node_modules
            apps/review-desktop/code-oss/extensions/node_modules
            apps/review-desktop/code-oss/extensions/*/node_modules
            apps/review-desktop/code-oss/extensions/*/server/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('apps/review-desktop/code-oss/**/package-lock.json') }}

      - name: Validate release artifacts
        run: |
          node apps/review-desktop/scripts/validate-release-artifacts.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      # Signed and stapled says nothing about whether the app runs. 0.0.3 shipped
      # with a Review server that died on a pruned devDependency, and 0.0.4 with a
      # main process that threw before creating a window — both passed every check
      # above. Launch it and require a renderer before anything reaches R2.
      - name: Smoke launch the packaged app
        run: node apps/review-desktop/scripts/smoke-launch-packaged.mjs

      # Payloads first, manifest last: a client must never see a latest.json
      # whose zip is not yet downloadable.
      - name: Upload release to R2
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_REGION: auto
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          DIST=apps/review-desktop/dist
          RELEASE_PREFIX="s3://${R2_BUCKET}/releases/${RELEASE_VERSION}/darwin-arm64"
          # The releases/latest/ key is version-free by design, so the version
          # rides along in the filename a client saves the download as.
          DMG_DISPOSITION="attachment; filename=\"df-review-${RELEASE_VERSION}.dmg\""

          aws s3 cp "$DIST/Review-darwin-arm64-${RELEASE_VERSION}.zip" \
            "${RELEASE_PREFIX}/Review-darwin-arm64-${RELEASE_VERSION}.zip" \
            --content-type application/zip
          aws s3 cp "$DIST/Review-darwin-arm64-${RELEASE_VERSION}.dmg" \
            "${RELEASE_PREFIX}/Review-darwin-arm64-${RELEASE_VERSION}.dmg" \
            --content-type application/x-apple-diskimage \
            --content-disposition "$DMG_DISPOSITION"
          aws s3 cp "$DIST/Review-darwin-arm64-${RELEASE_VERSION}.dmg" \
            "s3://${R2_BUCKET}/releases/latest/darwin-arm64/Review.dmg" \
            --content-type application/x-apple-diskimage \
            --content-disposition "$DMG_DISPOSITION"

          aws s3 cp "$DIST/latest.json" \
            "s3://${R2_BUCKET}/update/stable/darwin-arm64/latest.json" \
            --content-type application/json

      - name: Verify update feed
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Feed for an outdated client (expect 200 with ${RELEASE_VERSION}):"
          RESPONSE=$(curl -sf "https://update.dev.fast/api/update/darwin-arm64/stable/0000000000000000000000000000000000000000")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -F "\"productVersion\":\"${RELEASE_VERSION}\""
          echo "$RESPONSE" | grep -F "\"version\":\"${RELEASE_COMMIT}\""

          echo "Feed for the just-released commit (expect 204):"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://update.dev.fast/api/update/darwin-arm64/stable/${RELEASE_COMMIT}")
          echo "$STATUS"
          test "$STATUS" = "204"

      - name: Verify install landing
        if: ${{ !inputs.dry_run }}
        run: |
          echo "install.dev.fast (expect 302 to the disk image):"
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" https://install.dev.fast/)
          echo "$LOCATION"
          test "$LOCATION" = "https://install.dev.fast/releases/latest/darwin-arm64/Review.dmg"

          echo "Following it (expect 200 and a disk image):"
          curl -sfL -o /dev/null -w "%{http_code} %{content_type}\n" https://install.dev.fast/ \
            | grep -F "200 application/x-apple-diskimage"

      - name: Attach DMG to GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            "apps/review-desktop/dist/Review-darwin-arm64-${RELEASE_VERSION}.dmg"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/buildagent.keychain" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  finalize-release:
    name: Publish release
    needs: [tag, build]
    if: ${{ !inputs.dry_run }}
    runs-on: review_big_boy
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
